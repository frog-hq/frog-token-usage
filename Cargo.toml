[workspace]
members = [
  "crates/frog-token-usage",
  "crates/frog-token-usage-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/frog-hq/frog-token-usage"
rust-version = "1.82"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.14"
thiserror = "2.0"
walkdir = "2.5"
